<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary Simulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9; /* Optional: Light background color for better aesthetics */
        }
        .simulation {
            width: 100%;
            max-width: 500px; /* Optional: Limit the width of the simulation */
            margin: 0 auto; /* Center horizontally */
            padding: 20px;
        }
        .section {
            margin-bottom: 20px;
        }
        .assignment-question {
            margin-bottom: 10px;
        }
        button {
            margin-top: 10px;
        }
        h3 {
            margin-bottom: 10px;
        }
        .mandatory {
            color: red; /* Highlight mandatory fields with red asterisk */
        }
        .note {
            font-size: 0.9em;
            color: gray;
        }
    </style>
</head>
<body>
    <div class="simulation">

        <!-- Note about mandatory fields -->
        <div class="section note">
            <p>Fields marked with <span class="mandatory">*</span> are mandatory.</p>
        </div>
        
        <!-- Language Selection -->
        <div class="section">
            <label for="language">Select Language<span class="mandatory">*</span>:</label>
            <select id="language" onchange="loadWords()">
                <option value="">--Select Language--</option>
                <option value="english">English</option>
                <option value="hindi">Hindi</option>
            </select>
        </div>

        <!-- Word Selection -->
        <div class="section">
            <label for="word">Select Word<span class="mandatory">*</span>:</label>
            <select id="word" onchange="loadWordDetails()">
                <option value="">--Select Word--</option>
            </select>
        </div>

        <!-- POS Selection -->
        <div class="section">
            <label for="pos-options">Select POS (Optional):</label>
            <select id="pos-options">
                <option value="">--Select POS--</option>
            </select>
        </div>

        

        <!-- Dictionary Details -->
        <div class="section">
            <h3>Dictionary Details</h3>
            <div id="dictionary-details"></div>
        </div>

        <!-- Assignment Section -->
        <div class="section">
            <button id="start-assignment" onclick="startAssignment()" disabled>Start Assignment</button>
        </div>

        <div class="section">
            <h3>Assignment</h3>
            <div id="assignment-section"></div>
        </div>
    </div>

    <!-- Include the main.js script -->
    <script src="./js/main.js"></script>
<script src="../assets/js/iframeResize.js"></script>
        
        </body>
</html>
